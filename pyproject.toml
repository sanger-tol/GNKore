[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "genomenotekore"
version = "0.2.0"
description = "GenomeNote Helper scripts"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Damon-Lee Pointon" }]
keywords = [ "genomenote", "ena", "ncbi", "genomics" ]
dependencies = [
    "argparse>=1.4.0",
    "datetime>=5.5",
    "dotenv>=0.9.9",
    "logging>=0.4.9.6",
    "regex>=2024.11.6",
    "requests>=2.32.3",
]

[package.optional-dependencies]
dev = [
    "ruff>=0.11.11",
]

[project.scripts]
gnkore = "genomenotekore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
